name: Hermes PR monitor

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check tracked PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const upstream = { owner: 'NousResearch', repo: 'hermes-agent' };
            const tracked = [59892, 73655, 73658, 73660];
            const title = 'Hermes PR monitor';
            const marker = '<!-- hermes-pr-monitor-state';

            async function getPullRequest(number) {
              const { data: pull } = await github.rest.pulls.get({
                ...upstream,
                pull_number: number,
              });
              const { data: checks } = await github.rest.checks.listForRef({
                ...upstream,
                ref: pull.head.sha,
                per_page: 100,
              });
              const reviewData = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) {
                        nodes {
                          isResolved
                          comments(first: 1) {
                            nodes { body author { login } url }
                          }
                        }
                      }
                    }
                  }
                }
              `, { ...upstream, number });
              const unresolved = (reviewData.repository.pullRequest.reviewThreads.nodes || [])
                .filter(thread => !thread.isResolved)
                .map(thread => thread.comments.nodes[0])
                .filter(Boolean)
                .map(comment => ({
                  author: comment.author?.login || 'unknown',
                  body: comment.body.replace(/\s+/g, ' ').slice(0, 240),
                  url: comment.url,
                }));

              return {
                number,
                url: pull.html_url,
                state: pull.state,
                merged: pull.merged,
                draft: pull.draft,
                mergeable: pull.mergeable,
                mergeableState: pull.mergeable_state,
                headSha: pull.head.sha,
                checks: checks.check_runs
                  .map(check => ({
                    name: check.name,
                    status: check.status,
                    conclusion: check.conclusion,
                  }))
                  .sort((a, b) => a.name.localeCompare(b.name)),
                unresolved,
              };
            }

            const current = await Promise.all(tracked.map(getPullRequest));
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            let issue = issues.find(item => !item.pull_request && item.title === title);
            const stateBlock = `${marker}\n${JSON.stringify(current)}\n-->`;

            if (!issue) {
              const links = current.map(pr => `- [#${pr.number}](${pr.url})`).join('\n');
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: `This issue stores the latest status for the tracked Hermes PRs.\n\n${links}\n\n${stateBlock}`,
              });
              issue = created.data;
              core.info(`Created tracker issue #${issue.number}`);
            }

            const oldMatch = (issue.body || '').match(/<!-- hermes-pr-monitor-state\n([\s\S]*?)\n-->/);
            const previous = oldMatch ? JSON.parse(oldMatch[1]) : [];
            const previousByNumber = new Map(previous.map(pr => [pr.number, pr]));
            const signature = pr => JSON.stringify({
              merge: [pr.state, pr.merged, pr.draft, pr.mergeable, pr.mergeableState, pr.headSha],
              checks: pr.checks,
              unresolved: pr.unresolved,
            });
            const changed = current.filter(pr => signature(pr) !== signature(previousByNumber.get(pr.number) || {}));

            const intro = (issue.body || '').split(marker)[0].trim();
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body: `${intro}\n\n${stateBlock}`,
            });

            if (previous.length && changed.length) {
              const lines = changed.map(pr => {
                const checks = pr.checks.length
                  ? pr.checks.map(check => `${check.name}: ${check.conclusion || check.status}`).join(', ')
                  : 'no checks reported';
                const reviews = pr.unresolved.length
                  ? `${pr.unresolved.length} unresolved review thread(s)`
                  : 'no unresolved review threads';
                return `- [#${pr.number}](${pr.url}): ${pr.state}, mergeable=${pr.mergeableState}, ${reviews}. CI: ${checks}`;
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Hermes PR status changed:\n\n${lines.join('\n')}`,
              });
            }
